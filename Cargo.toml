[package]
name = "riftsense-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "RiftSense reescrito en Rust"
license = "UNLICENSED"
publish = false
build = "build.rs"

[lib]
name = "riftsense"
path = "src/lib.rs"

[profile.release]
strip = true

[[bin]]
name = "riftsense"
path = "src/main.rs"

[[bin]]
name = "parity_probe"
path = "src/bin/parity_probe.rs"

[[bin]]
name = "riftsense-desktop"
path = "src/bin/riftsense-desktop.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dunce = "1"
indexmap = { version = "2", features = ["serde"] }
mime_guess = "2"
open = "5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rust-embed = { version = "8", features = ["axum", "mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tract-onnx = "0.23"
unicode-normalization = "0.1"
winreg = "0.56"
wry = "0.57"
tao = "0.37"
